# Render Blueprint — deploys the Django backend + a free Postgres database.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: medixpro-backend
    runtime: python
    plan: free
    # The Django project lives in a subfolder of the repo.
    rootDir: medixpro_backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn medixpro_backend.wsgi:application"
    envVars:
      - key: DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true          # Render generates a strong secret
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: DATABASE_URL
        fromDatabase:
          name: medixpro-db
          property: connectionString
      # ── Sham Cash payment secrets — set real values in the dashboard ──
      - key: SHAMCASH_AGENT_KEY
        sync: false
      - key: SHAMCASH_SECRET_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false                  # set to https://<your-service>.onrender.com

databases:
  - name: medixpro-db
    plan: free
    databaseName: medixpro
    user: medixpro
